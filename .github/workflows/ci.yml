name: ci

# The same gates the pipeline runs, run somewhere other than one laptop.
# Before this existed, main was green on trust.
#
# Every pushed branch is covered, not just the ones with a pull request open:
# a branch nobody has opened a PR for is still green on trust, and work sat on
# one for days once while the gates ran nowhere but a laptop.
on:
  # Fork branches live in another repository, so no push here announces them.
  # A same-repo pull request runs again here even though its branch's push
  # already ran. The rule protecting main reads the newest result of each
  # required check on the head commit, and a job skipped by an `if` reports
  # as passing — so a pull request run that skipped its jobs used to hide a
  # failed push run behind it. Both runs now do the work.
  pull_request:
  push:
    branches: ['**']

# A second push to the same branch makes the first run's answer worthless.
# A pull request's run is grouped under its own ref, so it never cancels the
# push run of the same commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node 22.18.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json packageManager.
      - uses: pnpm/action-setup@v4

      # The floor `package.json` engines declares, and only the floor. This ran
      # as a two-version matrix until 2026-09-04, which meant 4,900 tests twice
      # to answer one question. The floor is the half worth keeping: Node is
      # backward compatible in the direction that matters, so code written on 24
      # almost always runs on 22, while a 24-only API passes on 24 and breaks
      # every Node 22 user. Testing the floor catches that; testing 24 does not.
      # Development happens on the version in .nvmrc and gates it locally on
      # every run, so 24 is covered — just not twice, in two places.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome, TypeScript, then the mirror check — the same command
      # lightsout.config.json points its `check` gate at.
      - run: pnpm check

      # Runs the unit suite AND the 95% coverage thresholds declared in
      # tests/config/jest.config.cjs. No git identity setup is needed: the
      # helpers that build throwaway repos pass their own with `git -c`.
      - run: pnpm test:unit:coverage

      - run: pnpm test:e2e

  shipped:
    name: plugin is shippable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comparison needs the base branch's history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # scripts/checkShipped.mjs is the only definition of what "shippable"
      # means: the engine bundle matches packages/engine/src/, the standards copy
      # matches packages/lightsout-standards/, and plugin.json
      # carries a new version when either moved.
      # The pre-push hook runs this same file, so a local pass and a CI pass
      # cannot mean different things.
      #
      # On a pull request the base is the branch being merged into. On a push
      # to a working branch it is main, which is where that branch is headed and
      # what `pnpm check:shipped` compares against locally. On a push to main
      # there is nothing to bump against, and the script says so and skips that
      # third question rather than inventing an answer.
      - name: Check that plugin/ is shippable
        env:
          PULL_REQUEST_BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$PULL_REQUEST_BASE" ]; then
            base="$PULL_REQUEST_BASE"
          elif [ "$BRANCH" != "main" ]; then
            base=main
          else
            base=""
          fi

          if [ -n "$base" ]; then
            git fetch --no-tags origin "$base"
            node scripts/checkShipped.mjs --base FETCH_HEAD
          else
            node scripts/checkShipped.mjs --base HEAD
          fi

      # The web app carries the authored default pack as assets/default-pack.json,
      # because the copy plugin/standards/ ships has its fixtures stripped and a
      # rule page has to show the code a rule argues about. The committed view is
      # guarded here, beside the shipped tree, and by the same line in the
      # pre-push hook.
      - name: Check that the bundled default pack is current
        run: pnpm check:default-pack

  release:
    name: tag and release
    # Every branch is verified now; only main is released.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, shipped]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag follows the version rather than leading it, so the release notes
      # describe a build that already passed every gate above.
      - name: Release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")
          tag="v$version"

          # Asked over the API rather than from local tags, so a shallow
          # checkout still gets a truthful answer.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released — nothing to do."
            exit 0
          fi

          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
